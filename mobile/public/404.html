<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConnectCards</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/+/, "");
        var hash = path ? "#" + window.location.pathname + window.location.search + window.location.hash : "#/";
        window.location.replace("/" + hash);
      })();
    </script>
  </head>
